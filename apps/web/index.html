<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechBazaar — Curated Electronics & Modern Gadgets</title>
    <meta name="description" content="Minimal, editorial electronics and gadgets store. Premium audio, smartwatches, accessories and gaming essentials." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var b = JSON.parse(localStorage.getItem('techbazaar_branding') || '{}');
          if (b.accent_hex) {
            var r = document.documentElement;
            r.style.setProperty('--accent', b.accent_hex);
            r.style.setProperty('--accent-hover', b.accent_hover || b.accent_hex);
            r.style.setProperty('--accent-tint', b.accent_tint || '#FFEDE6');
            r.style.setProperty('--accent-contrast', b.accent_contrast || '#FFFFFF');
            r.style.setProperty('--accent-ring', b.accent_ring || 'rgba(255, 77, 0, 0.35)');
            r.style.setProperty('--color-primary', b.accent_hex);
            r.style.setProperty('--color-primary-hover', b.accent_hover || b.accent_hex);
            r.style.setProperty('--color-primary-light', b.accent_tint || '#FFEDE6');
          }
          if (b.brand_name) {
            document.title = b.brand_name + (b.tagline ? ' — ' + b.tagline : '');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-[#0A0A0A] font-sans antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
