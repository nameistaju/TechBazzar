<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg-m-b2b-partner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <pattern id="grid-m-b2b-partner" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg-m-b2b-partner)" />
  <rect width="1200" height="900" fill="url(#grid-m-b2b-partner)" opacity="0.6" />
  <circle cx="1000" cy="150" r="300" fill="#FF4D00" opacity="0.14" />

  <rect x="20" y="20" width="1160" height="860" fill="none" stroke="#333333" stroke-width="1.5" rx="6" />
  <rect x="70" y="100" width="8" height="700" fill="#FF4D00" rx="2" />

  <g transform="translate(110, 0)">
    <!-- Badge -->
    <rect x="0" y="130" width="300" height="42" fill="#1C1C1C" stroke="#333333" stroke-width="1" rx="3" />
    <circle cx="24" cy="151" r="5" fill="#FF4D00" />
    <text x="42" y="157" fill="#EAEAEA" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" text-transform="uppercase">B2B PARTNER NETWORK</text>

    <!-- Main Title -->
    <text x="0" y="270" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="1.5" text-transform="uppercase">BECOME A REGISTERED RESELLER</text>

    <!-- Subtitle (Wrapped for mobile) -->
    <text x="0" y="370" fill="#BDBDBD" font-family="system-ui, sans-serif" font-size="28" font-weight="400" letter-spacing="0.5">
      Custom Quotations, Dedicated Logistics, and Flexible Payment Terms
    </text>

    <!-- Subtext -->
    <text x="0" y="470" fill="#888888" font-family="system-ui, sans-serif" font-size="20" font-weight="500" letter-spacing="1" text-transform="uppercase">Over 1,200 Electronics Retailers Powered Across India</text>

    <!-- Button Graphic -->
    <g transform="translate(0, 560)">
      <rect x="0" y="0" width="460" height="74" fill="#FF4D00" rx="6" />
      <text x="230" y="45" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="2" text-anchor="middle" text-transform="uppercase">REQUEST A CUSTOM QUOTE →</text>
    </g>
  </g>
</svg>