<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" width="1800" height="600">
  <defs>
    <linearGradient id="bg-smart-audio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="60%" stop-color="#141414" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <pattern id="grid-smart-audio" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1800" height="600" fill="url(#bg-smart-audio)" />
  <rect width="1800" height="600" fill="url(#grid-smart-audio)" opacity="0.6" />
  
  <!-- Subtle orange aura glow in top-right corner -->
  <circle cx="1600" cy="100" r="350" fill="#FF4D00" opacity="0.12" />
  <circle cx="1700" cy="500" r="250" fill="#FF4D00" opacity="0.08" />

  <!-- 1px Hairline Frame -->
  <rect x="24" y="24" width="1752" height="552" fill="none" stroke="#333333" stroke-width="1" rx="4" />

  <!-- Safe Zone Visual Accent Bar -->
  <rect x="120" y="110" width="8" height="380" fill="#FF4D00" rx="2" />

  <!-- Content (Kept within 80% Central Safe Zone) -->
  <g transform="translate(160, 0)">
    <!-- Badge -->
    <rect x="0" y="140" width="280" height="34" fill="#1C1C1C" stroke="#333333" stroke-width="1" rx="2" />
    <circle cx="20" cy="157" r="4" fill="#FF4D00" />
    <text x="36" y="162" fill="#EAEAEA" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-transform="uppercase">FACTORY DIRECT STOCK</text>

    <!-- Main Title -->
    <text x="0" y="250" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="2" text-transform="uppercase">ACOUSTIC HARDWARE FOR RESELLERS</text>

    <!-- Subtitle -->
    <text x="0" y="315" fill="#BDBDBD" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" letter-spacing="0.5">Premium Wireless Earbuds & ANC Audio with 35%+ Resale Margins</text>

    <!-- Subtext Details -->
    <text x="0" y="375" fill="#888888" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" letter-spacing="1" text-transform="uppercase">Tier 1 to Tier 3 Bulk Tiers • Direct Brand Warranty Included</text>

    <!-- Action Pill Button Graphic -->
    <g transform="translate(0, 420)">
      <rect x="0" y="0" width="340" height="54" fill="#FF4D00" rx="4" />
      <text x="170" y="33" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle" text-transform="uppercase">BROWSE AUDIO CATALOGUE →</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Minimal Geometric Art -->
  <g transform="translate(1360, 180)" stroke="#FF4D00" stroke-width="2" fill="none" opacity="0.8">
    <rect x="0" y="0" width="220" height="220" rx="8" stroke="#333333" stroke-width="2" />
    <rect x="30" y="30" width="160" height="160" rx="4" stroke="#FF4D00" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="110" cy="110" r="45" fill="#1C1C1C" stroke="#FF4D00" stroke-width="2" />
    <text x="110" y="117" fill="#FF4D00" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">TB</text>
  </g>
</svg>